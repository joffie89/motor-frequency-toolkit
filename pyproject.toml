[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motorfreq"
version = "0.1.0"
description = "Reusable claim-frequency modelling, feature selection and monitoring for motor insurance pricing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.5",
    "pyreadr>=0.5",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
